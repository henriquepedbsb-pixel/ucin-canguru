
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receituário UCIN Canguru</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#eef2f7;color:#1a2332;min-height:100vh}

.header{background:linear-gradient(135deg,#0d3b6e,#1a6896);color:#fff;padding:18px 24px;text-align:center}
.header h1{font-size:1.4rem;letter-spacing:.5px}
.header p{font-size:.8rem;opacity:.8;margin-top:3px}

.container{max-width:760px;margin:0 auto;padding:20px 14px}

.card{background:#fff;border-radius:10px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card-title{font-size:.78rem;font-weight:700;color:#0d3b6e;text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid #1a6896;padding-bottom:7px;margin-bottom:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:.72rem;font-weight:600;color:#4a6274;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select{border:1.5px solid #c8d6df;border-radius:6px;padding:8px 10px;font-size:.92rem;color:#1a2332;background:#f8fbfd;transition:border-color .2s}
.fg input:focus,.fg select:focus{outline:none;border-color:#1a6896;background:#fff}

.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 24px;border:none;border-radius:7px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .18s}
.btn-primary{background:linear-gradient(135deg,#0d3b6e,#1a6896);color:#fff;box-shadow:0 3px 10px rgba(26,104,150,.35)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(26,104,150,.45)}
.btn-print{background:#f0f4f8;color:#0d3b6e;border:1.5px solid #1a6896}
.btn-print:hover{background:#e2edf5}
.btn-clear{background:#f8f0f0;color:#842029;border:1.5px solid #dc3545}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

/* hidden FM85/formula options */
#fm-opts,#formula-opts{display:none}

/* ===== RECEITUÁRIO ===== */
#placeholder{text-align:center;color:#999;padding:28px 0;font-size:.92rem}
.rx{display:none}
.rx.on{display:block}

.rx-paper{
  background:#fff;
  border:1px solid #c8d6df;
  border-radius:8px;
  padding:32px 36px;
  max-width:680px;
  margin:0 auto;
  font-family:'Segoe UI',Arial,sans-serif;
}

/* Cabeçalho do receituário */
.rx-letterhead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:2px solid #0d3b6e;
  padding-bottom:14px;
  margin-bottom:20px;
  gap:16px;
}
.rx-letterhead-left h2{
  font-size:1.05rem;
  color:#0d3b6e;
  font-weight:700;
  letter-spacing:.3px;
}
.rx-letterhead-left p{
  font-size:.75rem;
  color:#6a7e8f;
  margin-top:3px;
}
.rx-letterhead-right{
  text-align:right;
  font-size:.75rem;
  color:#6a7e8f;
  white-space:nowrap;
}

/* Dados do paciente no receituário */
.rx-patient{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px 24px;
  background:#f5f8fc;
  border-radius:7px;
  padding:12px 16px;
  margin-bottom:22px;
  font-size:.88rem;
}
.rx-patient .field{display:flex;gap:6px;align-items:baseline}
.rx-patient .field-lbl{font-size:.7rem;font-weight:700;color:#4a6274;text-transform:uppercase;white-space:nowrap}
.rx-patient .field-val{font-weight:600;color:#1a2332;border-bottom:1px solid #c8d6df;min-width:180px;padding-bottom:1px}

/* Título Rx */
.rx-symbol{
  font-size:2rem;
  color:#0d3b6e;
  font-weight:700;
  font-style:italic;
  margin-bottom:6px;
  line-height:1;
}

/* Itens da receita */
.rx-list{list-style:none;padding:0;margin:0 0 24px 0}
.rx-list li{
  padding:10px 0 10px 18px;
  border-bottom:1px dashed #e0e8ef;
  position:relative;
  font-size:.93rem;
}
.rx-list li:last-child{border-bottom:none}
.rx-list li::before{
  content:counter(item);
  counter-increment:item;
  position:absolute;
  left:0;
  top:10px;
  font-size:.72rem;
  font-weight:700;
  color:#1a6896;
  width:14px;
}
.rx-list{counter-reset:item}

.rx-drug{font-weight:700;color:#1a2332;font-size:.95rem}
.rx-dose{color:#1a2332;margin-top:2px;font-size:.9rem}
.rx-note{font-size:.76rem;color:#7a8e9f;font-style:italic;margin-top:3px}
.rx-calc-badge{
  display:inline-block;
  font-size:.68rem;
  background:#eef6ff;
  color:#1a6896;
  border:1px solid #b8d4ef;
  border-radius:4px;
  padding:1px 6px;
  margin-top:4px;
  font-family:'Courier New',monospace;
}

/* Rodapé do receituário */
.rx-footer-paper{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:28px;
  padding-top:16px;
  border-top:1px solid #c8d6df;
}
.rx-sign-block{text-align:center}
.rx-sign-line{border-bottom:1.5px solid #1a2332;margin-bottom:6px;height:36px}
.rx-sign-label{font-size:.72rem;color:#6a7e8f;text-transform:uppercase;letter-spacing:.4px}

.rx-date-block{
  font-size:.8rem;
  color:#6a7e8f;
  text-align:right;
  align-self:flex-end;
}

/* Não necessário */
.not-needed{color:#198754;font-weight:600}

@media(max-width:600px){
  .rx-paper{padding:20px 16px}
  .rx-patient{grid-template-columns:1fr}
  .rx-footer-paper{grid-template-columns:1fr}
}

@media print{
  body{background:#fff}
  .header,.form-card,.btn-row{display:none!important}
  .container{padding:0;max-width:100%}
  .card{box-shadow:none;border:none;padding:0;margin:0}
  .rx{display:block!important}
  #placeholder{display:none}
  .rx-paper{border:1px solid #ccc;padding:24px 28px}
  .rx-calc-badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="header">
  <h1>&#128220; Receituário UCIN Canguru</h1>
  <p>Suplementação neonatal com cálculo automático de doses</p>
</div>

<div class="container">

<!-- ===== FORMULÁRIO ===== -->
<div class="card form-card">

  <div class="card-title">&#128101; Identificação</div>
  <div class="grid">
    <div class="fg" style="grid-column:span 2">
      <label>Nome do Paciente *</label>
      <input type="text" id="nome" placeholder="Ex: RN de Maria Silva">
    </div>
    <div class="fg">
      <label>Nº SES *</label>
      <input type="text" id="ses" placeholder="Ex: 123456">
    </div>
  </div>

  <div class="card-title" style="margin-top:20px">&#9878; Dados Clínicos</div>
  <div class="grid">
    <div class="fg">
      <label>Peso Atual (g) *</label>
      <input type="number" id="peso" placeholder="Ex: 1450" min="300" max="6000">
    </div>
    <div class="fg">
      <label>Peso Nascimento (g) *</label>
      <input type="number" id="pesorn" placeholder="Ex: 1200" min="300" max="6000">
    </div>
    <div class="fg">
      <label>IG Nascimento — semanas *</label>
      <input type="number" id="igSem" placeholder="Ex: 29" min="22" max="42">
    </div>
    <div class="fg">
      <label>IG Nascimento — dias</label>
      <input type="number" id="igDias" placeholder="0–6" min="0" max="6" value="0">
    </div>
  </div>

  <div class="card-title" style="margin-top:20px">&#127868; Dieta (para desconto de nutrientes)</div>
  <div class="grid">
    <div class="fg">
      <label>Tipo de Dieta *</label>
      <select id="tipoDieta" onchange="toggleDiet()">
        <option value="">— selecione —</option>
        <option value="lm">Leite Materno (LM) puro</option>
        <option value="lm_fm85">LM + FM85</option>
        <option value="formula">Fórmula infantil</option>
      </select>
    </div>
    <div class="fg">
      <label>Volume (mL/kg/dia) *</label>
      <input type="number" id="volKg" placeholder="Ex: 160" min="40" max="250">
    </div>
  </div>

  <div id="fm-opts" class="grid" style="margin-top:10px">
    <div class="fg">
      <label>Sachês FM85/dia</label>
      <select id="sachets">
        <option value="2">2 sachês/dia</option>
        <option value="4">4 sachês/dia</option>
        <option value="6" selected>* 6 sachês/dia</option>
        <option value="8">8 sachês/dia</option>
      </select>
    </div>
  </div>

  <div id="formula-opts" class="grid" style="margin-top:10px">
    <div class="fg">
      <label>Fórmula</label>
      <select id="formula">
        <option value="aptamil">Aptamil Premium 1</option>
        <option value="nan_comfor">NAN Comfor 1</option>
        <option value="nan_supreme">NAN Supreme 1</option>
        <option value="alfamino">Alfamino</option>
        <option value="pregomin">Pregomin Pepti</option>
      </select>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="gerar()">&#128220; Gerar Receituário</button>
    <button class="btn btn-print" onclick="window.print()">&#128424; Imprimir / PDF</button>
    <button class="btn btn-clear" onclick="limpar()">&#10006; Limpar</button>
  </div>
</div>

<!-- ===== RECEITUÁRIO ===== -->
<div class="card">
  <div id="prescricao" class="rx"></div>
  <div id="placeholder">Preencha os dados acima e clique em <strong>Gerar Receituário</strong></div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);
const fv = (n,d=1) => Number(n).toFixed(d);

function toggleDiet(){
  const t = $('tipoDieta').value;
  $('fm-opts').style.display      = t==='lm_fm85' ? 'grid' : 'none';
  $('formula-opts').style.display = t==='formula' ? 'grid' : 'none';
}

function limpar(){
  ['nome','ses','peso','pesorn','igSem','igDias','volKg'].forEach(id=>$(id).value='');
  $('igDias').value='0'; $('tipoDieta').value=''; $('sachets').value='6'; $('formula').value='aptamil';
  toggleDiet();
  $('prescricao').className='rx'; $('prescricao').innerHTML='';
  $('placeholder').style.display='';
}

// ── Composição nutricional ───────────────────────────────────────────────────
const LM_100      = {p:14, zn:0.15, vitD:2};
const FM85_SACHET = {p:11, zn:0.24, vitD:35};
const FORMULAS = {
  aptamil:    {nome:'Aptamil Premium 1', p:40, zn:0.58, vitD:44},
  nan_comfor: {nome:'NAN Comfor 1',      p:24, zn:0.55, vitD:52},
  nan_supreme:{nome:'NAN Supreme 1',     p:24, zn:0.52, vitD:36},
  alfamino:   {nome:'Alfamino',          p:42, zn:0.66, vitD:40},
  pregomin:   {nome:'Pregomin Pepti',    p:28, zn:0.50, vitD:44},
};

const FOSFATO_P_POR_ML  = 25;
const FOSFATO_TOMADAS   = 4;         // sempre 6/6h
const POLIVIT_VITD_DIA  = 400;       // Growvit BB / Pedianutri: 400 UI em 12 gts

// ── Cálculo principal ────────────────────────────────────────────────────────
function gerar(){
  const peso    = parseFloat($('peso').value);
  const pesorn  = parseFloat($('pesorn').value);
  const igSem   = parseInt($('igSem').value);
  const igDias  = parseInt($('igDias').value)||0;
  const tipo    = $('tipoDieta').value;
  const volKg   = parseFloat($('volKg').value);
  const sachets = parseInt($('sachets').value)||0;
  const formula = $('formula').value;
  const nome    = $('nome').value.trim();
  const ses     = $('ses').value.trim();

  // Validação
  const erros=[];
  if(!nome)                    erros.push('Nome do paciente');
  if(!ses)                     erros.push('Nº SES');
  if(!peso   ||isNaN(peso))    erros.push('Peso atual');
  if(!pesorn ||isNaN(pesorn))  erros.push('Peso de nascimento');
  if(!igSem  ||isNaN(igSem))   erros.push('IG nascimento');
  if(!tipo)                    erros.push('Tipo de dieta');
  if(!volKg  ||isNaN(volKg))   erros.push('Volume mL/kg/dia');
  if(erros.length){alert('Campos obrigatórios:\n• '+erros.join('\n• '));return;}

  const pesoKg = peso/1000;
  const menor32 = igSem < 32;
  const volTotal = volKg * pesoKg;

  // Nutrientes da dieta
  let dP=0, dZn=0, dVitD=0;
  if(tipo==='lm'||tipo==='lm_fm85'){
    const f=volTotal/100;
    dP+=f*LM_100.p; dZn+=f*LM_100.zn; dVitD+=f*LM_100.vitD;
    if(tipo==='lm_fm85'){
      dP+=sachets*FM85_SACHET.p; dZn+=sachets*FM85_SACHET.zn; dVitD+=sachets*FM85_SACHET.vitD;
    }
  } else {
    const fm=FORMULAS[formula]; const f=volTotal/100;
    dP=f*fm.p; dZn=f*fm.zn; dVitD=f*fm.vitD;
  }

  // 1. Ferro
  let ferroRate;
  if     (pesorn<1000) ferroRate=4;
  else if(pesorn<1500) ferroRate=3;
  else if(pesorn<2500) ferroRate=2;
  else                  ferroRate=1;
  const ferroDose = ferroRate*pesoKg;
  const ferroGotas = Math.ceil(ferroDose/1.25); // arredonda sempre para cima (gota inteira)

  // 2. Fósforo (6/6h — 4 tomadas)
  const pAlvoMin=75*pesoKg, pAlvoMax=100*pesoKg, pAlvoMid=87.5*pesoKg;
  const pNec=Math.max(0,pAlvoMid-dP);
  const pVolMl=pNec/FOSFATO_P_POR_ML;
  const pVolTom=pVolMl/FOSFATO_TOMADAS;
  const pSufic=dP>=pAlvoMin;

  // 3. Zinco
  const znRate=menor32?2:1;
  const znAlvo=znRate*pesoKg;
  const znNec=Math.max(0,znAlvo-dZn);
  const znVolMl=znNec/5;

  // 4. Polivitamínico — fixo
  // 5. Vitamina D (desconta dieta + polivitamínico)
  let vitDAlvo; if(igSem<32)vitDAlvo=800; else if(igSem<37)vitDAlvo=600; else vitDAlvo=400;
  const vitDTotal=dVitD+POLIVIT_VITD_DIA;
  const vitDNec=Math.max(0,vitDAlvo-vitDTotal);
  const gotas200=Math.ceil(vitDNec/200);
  const gotas400=Math.ceil(vitDNec/400);

  // Data
  const hoje = new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const agora = new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  // ── Montar receituário ────────────────────────────────────────────────────
  let itens = '';

  // 1. Sulfato ferroso
  itens += `<li>
    <div class="rx-drug">Sulfato ferroso (sol. oral 25 mg/mL)</div>
    <div class="rx-dose">${ferroGotas} gotas VO 1×/dia</div>
    <span class="rx-calc-badge">PN ${pesorn}g → ${ferroRate} mg/kg/dia × ${fv(pesoKg,3)} kg = ${fv(ferroDose,2)} mg ÷ 1,25 mg/gota = ${fv(ferroDose/1.25,2)} → ${ferroGotas} gota(s)</span>
  </li>`;

  // 2. Fosfato tricálcico
  if(pSufic){
    itens += `<li>
      <div class="rx-drug">Fosfato tricálcico 12,9%</div>
      <div class="rx-dose"><span class="not-needed">Não necessário</span></div>
      <span class="rx-calc-badge">Dieta supre ${fv(dP,1)} mg P/dia ≥ mín. ${fv(pAlvoMin,1)} mg/dia ✓</span>
    </li>`;
  } else {
    itens += `<li>
      <div class="rx-drug">Fosfato tricálcico 12,9%</div>
      <div class="rx-dose">${fv(pVolTom,2)} mL VO 6/6h (${fv(pVolMl,1)} mL/dia em 4 tomadas)</div>
      <span class="rx-calc-badge">Alvo 87,5 mg/kg/dia = ${fv(pAlvoMid,1)} mg/dia · Dieta: ${fv(dP,1)} mg/dia · Déficit: ${fv(pNec,1)} mg ÷ 25 mg/mL = ${fv(pVolMl,1)} mL/dia</span>
    </li>`;
  }

  // 3. Sulfato de zinco
  if(znNec<=0.005){
    itens += `<li>
      <div class="rx-drug">Sulfato de zinco (sol. 5 mg/mL)</div>
      <div class="rx-dose"><span class="not-needed">Não necessário</span></div>
      <span class="rx-calc-badge">Dieta supre ${fv(dZn,2)} mg Zn/dia ≥ alvo ${fv(znAlvo,2)} mg/dia ✓</span>
    </li>`;
  } else {
    itens += `<li>
      <div class="rx-drug">Sulfato de zinco (sol. 5 mg/mL)</div>
      <div class="rx-dose">${fv(znVolMl,2)} mL VO 1×/dia</div>
      <span class="rx-calc-badge">${znRate} mg/kg/dia × ${fv(pesoKg,3)} kg = ${fv(znAlvo,2)} mg/dia · Dieta: ${fv(dZn,2)} mg/dia · Déficit: ${fv(znNec,2)} mg ÷ 5 mg/mL = ${fv(znVolMl,2)} mL</span>
    </li>`;
  }

  // 4. Polivitamínico
  itens += `<li>
    <div class="rx-drug">Polivitamínico (Growvit BB / Pedianutri ou equiv.)</div>
    <div class="rx-dose">6 gotas VO 12/12h</div>
    <span class="rx-calc-badge">Dose fixa · 400 UI Vit D/dia (6 gts 12/12h = 12 gts/dia)</span>
  </li>`;

  // 5. Vitamina D
  if(vitDNec<=0){
    itens += `<li>
      <div class="rx-drug">Vitamina D (Colecalciferol)</div>
      <div class="rx-dose"><span class="not-needed">Não necessário</span></div>
      <span class="rx-calc-badge">Alvo ${vitDAlvo} UI/dia · Dieta: ${fv(dVitD,0)} UI + Polivit: ${POLIVIT_VITD_DIA} UI = ${fv(vitDTotal,0)} UI/dia ≥ alvo ✓</span>
    </li>`;
  } else {
    const doseTexto = gotas200>0
      ? `${gotas200} gota(s)/dia se 200 UI/gota  |  ${gotas400} gota(s)/dia se 400 UI/gota`
      : `${gotas400} gota(s)/dia se 400 UI/gota`;
    itens += `<li>
      <div class="rx-drug">Vitamina D (Colecalciferol)</div>
      <div class="rx-dose">${fv(vitDNec,0)} UI VO 1×/dia — ${doseTexto}</div>
      <div class="rx-note">Ajustar conforme apresentação disponível na unidade</div>
      <span class="rx-calc-badge">Alvo ${vitDAlvo} UI − Dieta ${fv(dVitD,0)} UI − Polivit ${POLIVIT_VITD_DIA} UI = ${fv(vitDNec,0)} UI adicionais</span>
    </li>`;
  }

  // ── HTML do receituário ───────────────────────────────────────────────────
  const html = `
  <div class="rx-paper">

    <div class="rx-letterhead">
      <div class="rx-letterhead-left">
        <h2>&#9877; UCIN Canguru</h2>
        <p>Receituário de Suplementação Neonatal</p>
      </div>
      <div class="rx-letterhead-right">
        <div>${hoje}</div>
        <div style="margin-top:4px;font-size:.7rem">Gerado ${agora}</div>
      </div>
    </div>

    <div class="rx-patient">
      <div class="field">
        <span class="field-lbl">Paciente:</span>
        <span class="field-val">${nome}</span>
      </div>
      <div class="field">
        <span class="field-lbl">Nº SES:</span>
        <span class="field-val">${ses}</span>
      </div>
      <div class="field" style="font-size:.78rem;color:#6a7e8f;grid-column:span 2">
        Peso atual: <strong>${peso.toLocaleString('pt-BR')} g</strong> &nbsp;·&nbsp;
        PN: <strong>${pesorn.toLocaleString('pt-BR')} g</strong> &nbsp;·&nbsp;
        IG nasc.: <strong>${igSem}sem${igDias?` ${igDias}d`:''}</strong> &nbsp;·&nbsp;
        Vol. dieta: <strong>${fv(volKg,0)} mL/kg/dia</strong>
      </div>
    </div>

    <div class="rx-symbol">&#8478;</div>

    <ol class="rx-list">${itens}</ol>

    <div class="rx-footer-paper">
      <div class="rx-sign-block">
        <div class="rx-sign-line"></div>
        <div class="rx-sign-label">Médico Responsável / CRM</div>
      </div>
      <div class="rx-date-block">
        Brasília – DF<br>${hoje}
      </div>
    </div>

  </div>`;

  $('prescricao').innerHTML = html;
  $('prescricao').className = 'rx on';
  $('placeholder').style.display = 'none';
  $('prescricao').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
